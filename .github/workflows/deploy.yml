# Builds the essay and publishes it to GitHub Pages.
#
# The site is UNLISTED, not private: GitHub Pages has no access control outside
# Enterprise Cloud, so anyone holding the URL can open it. Discovery is blocked
# by public/robots.txt and the noindex meta in index.html — do not remove those
# while the draft is under review.
name: Deploy review copy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite is ~2s; a broken build should never reach the reviewers.
      - run: npm test

      - run: npm run build
        env:
          # Project pages serve from /<repo>/, so assets need that prefix.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Setting this switches on the reviewer footer. Unset it for a public build.
          VITE_REVIEW_ISSUES_URL: ${{ github.server_url }}/${{ github.repository }}/issues/new

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
