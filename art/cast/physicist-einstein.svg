<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Paper Background -->
  <rect width="300" height="300" fill="#f7f4ec" />

  <g id="physicist-einstein">
    <!-- Ground Shadow -->
    <ellipse cx="150" cy="270" rx="46" ry="6.5" fill="#3c352b" fill-opacity="0.14" />

    <!-- Legs & Shoes -->
    <g id="legs">
      <!-- Dark trousers -->
      <line x1="136" y1="216" x2="136" y2="256" stroke="#3c352b" stroke-width="4.5" stroke-linecap="round" />
      <line x1="164" y1="216" x2="164" y2="256" stroke="#3c352b" stroke-width="4.5" stroke-linecap="round" />
      <!-- Rounded shoes -->
      <path d="M 122 260 C 122 253 144 253 144 260 Z" fill="#3c352b" stroke="#3c352b" stroke-width="2" stroke-linejoin="round" />
      <path d="M 156 260 C 156 253 178 253 178 260 Z" fill="#3c352b" stroke="#3c352b" stroke-width="2" stroke-linejoin="round" />
    </g>

    <!-- Torso / Jacket & Vest -->
    <g id="torso">
      <!-- Shirt body -->
      <path d="M 124 148 L 176 148 L 180 220 L 120 220 Z" fill="#fdf8ec" stroke="#3c352b" stroke-width="4.5" stroke-linejoin="round" />

      <!-- Tweed Jacket / Vest with curved lapels -->
      <path d="M 124 148 L 138 148 L 144 186 L 122 218 L 118 170 Z" fill="#e5d5ae" stroke="#3c352b" stroke-width="3" stroke-linejoin="round" />
      <path d="M 176 148 L 162 148 L 156 186 L 178 218 L 182 170 Z" fill="#e5d5ae" stroke="#3c352b" stroke-width="3" stroke-linejoin="round" />

      <!-- Vest Buttons -->
      <circle cx="150" cy="195" r="1.8" fill="#3c352b" />
      <circle cx="150" cy="207" r="1.8" fill="#3c352b" />

      <!-- Bow Tie -->
      <path d="M 143 147 L 150 151 L 143 155 Z" fill="#ecd3c5" stroke="#3c352b" stroke-width="2" stroke-linejoin="round" />
      <path d="M 157 147 L 150 151 L 157 155 Z" fill="#ecd3c5" stroke="#3c352b" stroke-width="2" stroke-linejoin="round" />
      <circle cx="150" cy="151" r="2.2" fill="#3c352b" />
    </g>

    <!-- Left Arm: relaxed, holding wooden pipe -->
    <g id="arm-left">
      <!-- Sleeve arc -->
      <path d="M 124 150 Q 104 170 112 196" fill="none" stroke="#3c352b" stroke-width="4.5" stroke-linecap="round" />
      <!-- Hand holding pipe -->
      <circle cx="113" cy="197" r="5" fill="#efdcc0" stroke="#3c352b" stroke-width="2" />
      <!-- Pipe -->
      <g id="pipe" transform="translate(104, 184)">
        <path d="M 9 15 Q 5 15 3 9 L 3 3 Q 7 3 7 9" fill="none" stroke="#3c352b" stroke-width="2.2" stroke-linecap="round" />
        <path d="M 1 3 L 9 3 L 8 10 L 2 10 Z" fill="#8b5e34" stroke="#3c352b" stroke-width="2" stroke-linejoin="round" />
        <!-- Soft circular smoke rings -->
        <circle cx="5" cy="-4" r="3.5" fill="none" stroke="#3c352b" stroke-width="1.6" stroke-dasharray="7 2" opacity="0.6" />
        <circle cx="11" cy="-11" r="2.2" fill="none" stroke="#3c352b" stroke-width="1.3" opacity="0.4" />
      </g>
    </g>

    <!-- Hair Background Layer (Wild Winged Side Tufts) -->
    <g id="hair-back" fill="#f6ead2" stroke="#3c352b" stroke-width="3">
      <!-- Left Side Wild Frizzy Tufts -->
      <circle cx="114" cy="84" r="17" />
      <circle cx="94" cy="98" r="18" />
      <circle cx="82" cy="120" r="17" />
      <circle cx="90" cy="142" r="15" />
      <circle cx="108" cy="150" r="12" />

      <!-- Right Side Wild Frizzy Tufts -->
      <circle cx="186" cy="84" r="17" />
      <circle cx="206" cy="98" r="18" />
      <circle cx="218" cy="120" r="17" />
      <circle cx="210" cy="142" r="15" />
      <circle cx="192" cy="150" r="12" />
    </g>

    <!-- Head & Face -->
    <g id="head">
      <!-- Face Base Circle (Prominent smooth balding forehead dome) -->
      <circle id="face-circle" cx="150" cy="114" r="34" fill="#efdcc0" stroke="#3c352b" stroke-width="4.5" />

      <!-- Hair Curls / Arcs Texture on Sides -->
      <g id="hair-curls" fill="none" stroke="#3c352b" stroke-width="2" stroke-linecap="round">
        <path d="M 88 92 A 10 10 0 0 1 104 104" />
        <path d="M 74 114 A 9 9 0 0 1 88 126" />
        <path d="M 82 136 A 8 8 0 0 1 96 144" />
        <path d="M 212 92 A 10 10 0 0 0 196 104" />
        <path d="M 226 114 A 9 9 0 0 0 212 126" />
        <path d="M 218 136 A 8 8 0 0 0 204 144" />
        <!-- Wild wisps -->
        <path d="M 70 106 Q 62 102 66 98" stroke-width="2.2" />
        <path d="M 230 106 Q 238 102 234 98" stroke-width="2.2" />
      </g>

      <!-- Forehead Contours (Aged wisdom lines) -->
      <path d="M 141 91 Q 150 88 159 91" fill="none" stroke="#3c352b" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 139 96 Q 150 93 161 96" fill="none" stroke="#3c352b" stroke-width="1.8" stroke-linecap="round" />

      <!-- Eyebrows (Arched, inquisitive) -->
      <path d="M 131 103 Q 137 98 143 102" fill="none" stroke="#3c352b" stroke-width="2.8" stroke-linecap="round" />
      <path d="M 157 102 Q 163 98 169 103" fill="none" stroke="#3c352b" stroke-width="2.8" stroke-linecap="round" />

      <!-- Wireframe Spectacles -->
      <g id="spectacles">
        <!-- Lenses -->
        <circle cx="136" cy="112" r="9.5" fill="#fdf8ec" fill-opacity="0.88" stroke="#3c352b" stroke-width="2.6" />
        <circle cx="164" cy="112" r="9.5" fill="#fdf8ec" fill-opacity="0.88" stroke="#3c352b" stroke-width="2.6" />
        <!-- Nose Bridge -->
        <path d="M 145.5 111 Q 150 108 154.5 111" fill="none" stroke="#3c352b" stroke-width="2.6" stroke-linecap="round" />
        <!-- Lens glass shine arcs -->
        <path d="M 131 108 A 6 6 0 0 1 137 105" fill="none" stroke="#3c352b" stroke-width="1.4" stroke-linecap="round" opacity="0.6" />
        <path d="M 159 108 A 6 6 0 0 1 165 105" fill="none" stroke="#3c352b" stroke-width="1.4" stroke-linecap="round" opacity="0.6" />

        <!-- Eyes (Chestnut brown iris + pupil) -->
        <circle cx="136" cy="112" r="2.8" fill="#5a4632" />
        <circle cx="136" cy="112" r="1.3" fill="#3c352b" />
        <circle cx="164" cy="112" r="2.8" fill="#5a4632" />
        <circle cx="164" cy="112" r="1.3" fill="#3c352b" />
      </g>

      <!-- Rounded Nose -->
      <path d="M 150 110 Q 153 119 150 123 Q 146 123 147 119" fill="none" stroke="#3c352b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Bushy Drooping Mustache (Compound arcs) -->
      <path d="M 130 127 C 136 123, 144 123, 150 127 C 156 123, 164 123, 170 127 C 169 137, 159 138, 150 136 C 141 138, 131 137, 130 127 Z" fill="#f6ead2" stroke="#3c352b" stroke-width="2.6" stroke-linejoin="round" />

      <!-- Gentle Smiling Chin/Mouth Line -->
      <path d="M 144 140 Q 150 143 156 140" fill="none" stroke="#3c352b" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Right Arm (Foreground Layer): Extended gracefully out to the right with pointing index finger ("Eureka!") -->
    <g id="arm-right">
      <!-- Sleeve sweeping dynamically out -->
      <path d="M 176 150 Q 206 172 232 138" fill="none" stroke="#3c352b" stroke-width="4.5" stroke-linecap="round" />
      <!-- Pointing Hand & Finger -->
      <g id="hand-pointing" transform="translate(233, 136)">
        <circle cx="0" cy="0" r="5" fill="#efdcc0" stroke="#3c352b" stroke-width="2.2" />
        <!-- Extended Index Finger pointing up -->
        <path d="M -1 -2 L 1 -18 Q 4 -20 6 -17 L 3 -1 Z" fill="#efdcc0" stroke="#3c352b" stroke-width="2.2" stroke-linejoin="round" />
      </g>
    </g>
  </g>
</svg>
